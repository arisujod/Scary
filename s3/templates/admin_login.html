{% extends "base.html" %}
{% block title %}Gpt · Admin{% endblock %}
{% block body %}
<div class="center">
<div class="card" style="max-width:400px;width:100%">
<div class="logo"><i class="fas fa-shield-halved"></i></div>
<h1 class="brand-title">G<span class="grad">pt</span></h1>
<div class="sub">ADMINISTRATOR ACCESS</div>
<input id="u" placeholder="Username" autocomplete="username">
<input id="p" type="password" placeholder="Password" autocomplete="current-password">
<button class="btn" onclick="lg()"><i class="fas fa-right-to-bracket"></i> LOGIN</button>
<div id="msg" class="msg"></div>
</div>
</div>
<script>
async function lg(){
m('msg',true,'Logging in...');
const d=await api('/admin/login',{user:document.getElementById('u').value,pass:document.getElementById('p').value});
if(d.ok)location.href='/admin';else m('msg',false,d.error||'Failed');
}
</script>
{% endblock %}
