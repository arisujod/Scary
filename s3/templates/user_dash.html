{% extends "base.html" %}
{% block title %}Gpt · Active{% endblock %}
{% block body %}
<div class="center">
<div class="card" style="max-width:420px;width:100%">
<div class="logo"><i class="fas fa-satellite-dish"></i></div>
<h1 class="brand-title">G<span class="grad">pt</span></h1>
<div class="sub">CONNECTION ACTIVE</div>
<div class="box" style="margin:0">
<table>
<tr><th>IP</th><td>{{ ip }}</td></tr>
<tr><th>Status</th><td><span class="badge ok">ACTIVE</span></td></tr>
<tr><th>Expires</th><td>{{ expires }}</td></tr>
</table>
</div>
<div class="hint"><i class="fas fa-circle-check"></i> Aapka IP registered hai. Ab game kholo — proxy settings automatically apply hongi.</div>
</div>
</div>
{% endblock %}
