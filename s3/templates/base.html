<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Gpt{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#060608;--card:rgba(20,9,12,.85);--border:rgba(255,45,85,.15);--red:#ff2d55;--red2:#ff5c3d;--glow:rgba(255,45,85,.35);--text:rgba(255,255,255,.7);--dim:rgba(255,255,255,.35);--grad:linear-gradient(135deg,#ff2d55,#ff5c3d)}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(600px 300px at 85% -10%,rgba(255,45,85,.13),transparent),radial-gradient(500px 300px at 5% 110%,rgba(255,92,61,.1),transparent);pointer-events:none;z-index:0}
h1,h2,h3,.stat b{font-family:'Space Grotesk',Inter,sans-serif;color:#fff}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;z-index:1}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:26px;backdrop-filter:blur(12px);box-shadow:0 20px 60px rgba(0,0,0,.6)}
.logo{width:62px;height:62px;border-radius:16px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;box-shadow:0 0 30px var(--glow);margin:0 auto 14px}
.brand-title{text-align:center;font-size:34px;letter-spacing:2px}
.sub{text-align:center;color:var(--dim);letter-spacing:4px;font-size:11px;margin:6px 0 20px;text-transform:uppercase}
input,select{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:#fff;font-size:15px;outline:none;margin-top:12px}
input:focus,select:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(255,45,85,.15)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border:none;border-radius:12px;background:var(--grad);color:#fff;font-weight:700;letter-spacing:1px;font-size:14px;cursor:pointer;margin-top:14px;box-shadow:0 8px 24px var(--glow);text-decoration:none}
.btn.small{width:auto;padding:9px 14px;margin:0;font-size:12px;border-radius:10px}
.btn.ghost{background:rgba(255,45,85,.07);border:1px solid var(--border);color:var(--text);box-shadow:none}
.btn.danger{background:rgba(255,45,85,.1);border:1px solid rgba(255,45,85,.4);color:#ff8095;box-shadow:none}
.btn.orange{background:linear-gradient(135deg,#ff9f0a,#ff5c3d);box-shadow:0 8px 24px rgba(255,159,10,.3)}
.msg{display:none;padding:12px;border-radius:12px;font-size:13px;margin-top:12px}
.msg.ok{display:block;background:rgba(48,209,88,.1);border:1px solid rgba(48,209,88,.3);color:#30d158}
.msg.err{display:block;background:rgba(255,45,85,.1);border:1px solid rgba(255,45,85,.3);color:#ff8095}
.hint{font-size:12px;color:var(--dim);margin-top:10px;line-height:1.5}
.panel{display:flex;min-height:100vh;position:relative;z-index:1}
.side{width:225px;background:rgba(12,6,9,.92);border-right:1px solid var(--border);padding:18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.side .brand{display:flex;gap:10px;align-items:center;margin-bottom:20px;color:#fff;font-family:'Space Grotesk';font-size:17px;letter-spacing:1px}
.side .brand .logo{width:38px;height:38px;margin:0;font-size:15px;border-radius:10px}
.nav button{display:flex;gap:10px;align-items:center;width:100%;padding:12px;border:none;border-radius:10px;background:transparent;color:var(--text);font-size:13px;cursor:pointer;margin-bottom:6px;text-align:left}
.nav button.on{background:var(--grad);color:#fff;box-shadow:0 6px 18px var(--glow)}
.side .foot{margin-top:auto}
.main{flex:1;padding:22px;max-width:1000px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}
.stat b{display:block;font-size:24px}
.stat span{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--dim)}
.box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px}
.box h3{font-size:14px;letter-spacing:1px;margin-bottom:12px;text-transform:uppercase}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid rgba(255,255,255,.05);word-break:break-all}
th{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:1px}
.badge{padding:3px 9px;border-radius:20px;font-size:10px}
.badge.ok{background:rgba(48,209,88,.12);color:#30d158}
.badge.no{background:rgba(255,45,85,.12);color:#ff8095}
.rowline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.modal-wrap{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-wrap.show{display:flex}
.modal{max-width:400px;width:100%;text-align:center}
.keybox{font-size:19px;font-weight:800;letter-spacing:2px;color:#fff;background:rgba(255,45,85,.08);border:1px dashed var(--red);border-radius:12px;padding:14px;margin:12px 0;user-select:all}
.iconbtn{background:none;border:none;color:var(--dim);cursor:pointer;font-size:14px;padding:4px}
.iconbtn:hover{color:#ff8095}
@media(max-width:760px){.panel{flex-direction:column}.side{width:100%;height:auto;position:static}.nav{display:flex;overflow-x:auto;gap:4px}.nav button{white-space:nowrap;width:auto}}
</style>
</head>
<body>
{% block body %}{% endblock %}
<div class="modal-wrap" id="keyModal">
<div class="modal card">
<div class="logo"><i class="fas fa-key"></i></div>
<h3>KEY CREATED</h3>
<div class="keybox" id="mk"></div>
<div class="hint">Key auto-copy ho gayi hai ✅ — phir bhi check karne ke liye COPY dabao</div>
<button class="btn" onclick="copyK()"><i class="fas fa-copy"></i> <span id="cp">COPY</span></button>
<button class="btn ghost" onclick="closeM()">CLOSE</button>
</div>
</div>
<script>
async function api(u,d){const r=await fetch(u,{method:d?'POST':'GET',headers:d?{'Content-Type':'application/json'}:{},body:d?JSON.stringify(d):undefined});return r.json();}
function showKey(k){document.getElementById('mk').textContent=k;document.getElementById('keyModal').classList.add('show');try{navigator.clipboard.writeText(k);}catch(e){}}
function copyK(){const k=document.getElementById('mk').textContent;try{navigator.clipboard.writeText(k);}catch(e){}document.getElementById('cp').textContent='COPIED ✓';setTimeout(()=>document.getElementById('cp').textContent='COPY',1200);}
function closeM(){document.getElementById('keyModal').classList.remove('show');}
function m(id,ok,txt){const e=document.getElementById(id);e.className='msg '+(ok?'ok':'err');e.textContent=txt;}
</script>
</body>
</html>
